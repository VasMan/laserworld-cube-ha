        tap_action:
          action: perform-action
          perform_action: laserworld_cube.play_overview_tile
          target:
            entity_id: image.laserworld_cube_847e_library_overview
          data:
            tile: 1
        hold_action:
          action: perform-action
          perform_action: laserworld_cube.playlist_add_tile
